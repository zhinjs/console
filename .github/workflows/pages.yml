name: Deploy Console to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zhin-console-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 9.0.2

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Require client + console-ui
        run: |
          test -f client/main.tsx
          test -d console-ui/src

      # A push to main publishes the site, so a failing check must stop the deployment.
      - run: pnpm typecheck

      - run: pnpm test

      - name: Build + SPA fallback
        env:
          CONSOLE_PAGES_BASE: ${{ vars.CONSOLE_PAGES_BASE || '' }}
          CONSOLE_PAGES_CNAME: ${{ vars.CONSOLE_PAGES_CNAME || 'console.zhin.dev' }}
        run: |
          pnpm build
          node scripts/prepare-github-pages.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
