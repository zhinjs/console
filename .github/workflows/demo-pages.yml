name: Deploy Demo Console to GitHub Pages

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zhin-demo-console-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build Demo profile
        env:
          VITE_DEMO_MODE: "1"
          VITE_API_BASE: https://demo-api.zhin.dev
          VITE_API_TOKEN: ${{ secrets.DEMO_CONSOLE_TOKEN }}
          CONSOLE_PAGES_BASE: ${{ vars.CONSOLE_PAGES_BASE || '' }}
          CONSOLE_PAGES_CNAME: ${{ vars.DEMO_PAGES_CNAME || 'demo.zhin.dev' }}
        run: |
          test -n "$VITE_API_TOKEN" || (echo "Missing DEMO_CONSOLE_TOKEN secret" && exit 1)
          pnpm build:demo
          node scripts/prepare-github-pages.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
