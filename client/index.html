<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F5F3" />
    <script>
      // Apply the bounded appearance preference before styles or the app can paint (console-ui 1.3.0 has
      // one set of colors; light = `.light`, dark = `.dark`, system = data-theme="system" + the resolved class).
      (() => {
        const root = document.documentElement;
        let mode = 'system';
        try { const value = localStorage.getItem('theme'); if (['light', 'dark', 'system'].includes(value)) mode = value; } catch {}
        root.dataset.themeMode = mode;
        if (mode === 'system') root.dataset.theme = 'system';
        const dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.add(dark ? 'dark' : 'light');
        if (dark) document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#121010');
      })();
    </script>
    <meta name="description" content="管理 Zhin Bot 的渠道、能力、Agent、自动化与运行状态。" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Zhin Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
