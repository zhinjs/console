<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8faf9" />
    <script>
      // Apply bounded appearance preferences before styles or the app can paint.
      (() => {
        const root = document.documentElement;
        let mode = 'system', palette = 'forest';
        try { const value = localStorage.getItem('theme'); if (['light', 'dark', 'system'].includes(value)) mode = value; } catch {}
        try { const value = localStorage.getItem('zhin.console.palette'); if (['forest', 'ocean', 'plum', 'graphite'].includes(value)) palette = value; } catch {}
        root.dataset.themeMode = mode;
        root.dataset.palette = palette;
        const dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.add(dark ? 'dark' : 'light');
      })();
    </script>
    <meta name="description" content="管理 Zhin Bot 的渠道、能力、Agent、自动化与运行状态。" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Zhin Bot 工作台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
